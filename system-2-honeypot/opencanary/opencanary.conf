{
  "device.node_id": "hsx-opencanary-01",
  "ip": "0.0.0.0",

  "logtype": ["ALL"],
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {"format": "%(message)s"}
      },
      "handlers": {
        "file": {
          "class": "logging.handlers.RotatingFileHandler",
          "filename": "/var/log/opencanary/opencanary.log",
          "maxBytes": 10485760,
          "backupCount": 5,
          "formatter": "plain"
        }
      }
    }
  },

  "http.enabled": true,
  "http.port": 8080,
  "http.banner": "Apache/2.4.41 (Ubuntu)",
  "http.skin": "basicLogin",

  "ftp.enabled": true,
  "ftp.port": 21,
  "ftp.banner": "ProFTPD 1.3.5a Server",

  "smb.enabled": true,

  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.29-0ubuntu0.18.04.1",

  "ssh.enabled": false,
  "telnet.enabled": false,

  "ntp.enabled": false,
  "tftp.enabled": false,
  "vnc.enabled": false,

  "portscan.enabled": true,
  "portscan.ignore_localhost": false,
  "portscan.logfile": "/var/log/opencanary/portscan.log"
}


