# Group 17, Feature 161: Automatic Log Rotation — System 2's honeypot/IDS
# log files. tcpdump's own captures already rotate hourly via the
# systemd unit's `-G 3600` flag (see ../README.md); this covers the
# *application* logs the honeypots themselves write, which have no
# rotation of their own and will otherwise grow unbounded.
#
# Install:
#   sudo cp logrotate-honeypot.conf /etc/logrotate.d/honeyshield-honeypot
#   sudo logrotate -d /etc/logrotate.d/honeyshield-honeypot   # dry run to verify syntax
#
# logrotate runs from cron.daily by default on most distros — no extra
# scheduling needed once it's in /etc/logrotate.d/.
#
# Paths below assume the Docker named volumes from ../docker-compose.yml
# are bind-mounted to these host paths instead (adjust docker-compose.yml
# to mount them here if you haven't already — named volumes alone aren't
# reachable by the host's logrotate). Add to each service in
# docker-compose.yml, e.g. for cowrie:
#   volumes:
#     - /var/log/honeyshield/cowrie:/cowrie/cowrie-git/var/log/cowrie

/var/log/honeyshield/cowrie/*.json {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    # copytruncate (not the default move-and-signal) because Cowrie holds
    # its log file open for the life of the container and won't reopen a
    # new one on its own — truncating in place avoids losing events
    # written between rotation and a container restart.
}

/var/log/honeyshield/opencanary/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/honeyshield/dionaea/*.json {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/honeyshield/filebeat/*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}

/var/log/honeyshield/health_check.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
}
